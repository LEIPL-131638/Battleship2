name: Checkstyle Quality Gate

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Checkstyle
        uses: nikitasavitckii/checkstyle-action@v1
        with:
          checkstyle_config: Checkstyle/checkstyle-131638.xml
