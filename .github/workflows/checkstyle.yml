name: Checkstyle Quality Gate

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Checkstyle
        uses: dbelmont/action-checkstyle@v1.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: Checkstyle/checkstyle-131638.xml
          fail_on_error: true
